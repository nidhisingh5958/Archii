services:
  # Development services
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: archii_server
      POSTGRES_PASSWORD: "80gv7w6ZmQLq_rHnu9PO16zsFJcUCc4j"
    volumes:
      - archii_server_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "AEWFqMYnW809VeuC9FS18-l80BFC6dfG"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: pgvector/pgvector:pg16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: archii_server_test
      POSTGRES_PASSWORD: "yICJu7LEuyaCCVf7iGi4Wk-lMpYomLz4"
    volumes:
      - archii_server_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "Z3sdcd9d_MYbcBurFDn2CWdg95ubfzO0"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  archii_server_data:
  archii_server_test_data:
